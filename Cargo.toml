[package]
name = "img_optimizer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "CLI tool for optimizing images by similarity using the x265 codec"
readme = "README.md"
keywords = ["compression", "images", "x265", "cli"]
categories = ["multimedia::images", "command-line-utilities"]

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
image = "0.25.10"
kdtree = "0.8.0"
rand = "0.10.2"
